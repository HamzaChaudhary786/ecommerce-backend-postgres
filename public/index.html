<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVault API Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 1rem;
      max-width: 520px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.2);
      margin-bottom: 1.25rem;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .endpoints {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .endpoint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid #1e293b;
      font-size: 0.875rem;
    }
    .endpoint:last-child { border-bottom: none; }
    .endpoint a {
      color: #38bdf8;
      text-decoration: none;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .endpoint a:hover { text-decoration: underline; }
    .method {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="pulse"></span> ShopVault API Online
    </div>
    <h1>ShopVault Backend API</h1>
    <p>The e-commerce PostgreSQL REST API server is live on Vercel. Use the endpoints below to access the API services.</p>
    <div class="endpoints">
      <div class="endpoint">
        <span class="method">GET</span>
        <a href="/api/health">/api/health</a>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <a href="/api/listings">/api/listings</a>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <a href="/api/categories">/api/categories</a>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <a href="/api/stores">/api/stores</a>
      </div>
    </div>
  </div>
</body>
</html>
